name: hoarder-library

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hoarder
      POSTGRES_USER: hoarder
      POSTGRES_PASSWORD: ${HOARDER_DB_PASSWORD:-local-development-only}
    volumes:
      - ${HOARDER_DB_DATA:-hoarder-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoarder -d hoarder"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: library/apps/api/Dockerfile
    environment:
      HOARDER_DATABASE_URL: postgresql+psycopg://hoarder:${HOARDER_DB_PASSWORD:-local-development-only}@db:5432/hoarder
      HOARDER_DERIVATIVE_ROOT: /data/derivatives
      HOARDER_STORAGE_ROOTS: '${HOARDER_STORAGE_ROOTS:-[{"key":"primary","label":"Primary archive","path":"/media/primary","sentinel":".hoarder-root"},{"key":"secondary","label":"Secondary archive","path":"/media/secondary","sentinel":".hoarder-root"}]}'
    volumes:
      - ${HOARDER_MEDIA_ROOT_1:-./library/dev-media/primary}:/media/primary:ro
      - ${HOARDER_MEDIA_ROOT_2:-./library/dev-media/secondary}:/media/secondary:ro
      - ${HOARDER_DERIVATIVE_DATA:-hoarder-derivatives}:/data/derivatives
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: library/apps/web/Dockerfile
    ports:
      - "${HOARDER_BIND_ADDRESS:-0.0.0.0}:${HOARDER_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hoarder-db:
  hoarder-derivatives:
